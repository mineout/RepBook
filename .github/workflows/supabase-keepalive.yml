name: Supabase Keepalive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RepBook Supabase health endpoint
        run: |
          curl --fail --show-error --silent \
            -H "x-keepalive-key: ${{ secrets.KEEPALIVE_API_KEY }}" \
            "${{ secrets.KEEPALIVE_URL }}"
